<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Museu Virtual VR</title>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
</head>
<body>
  <a-scene>
    <a-assets>
      <!-- Nomes exatos conforme os arquivos no GitHub -->
      <img id="img1" src="cenario1.jpg">
      <img id="img2" src="cenario2.jpg">
      <img id="img3" src="cenario3.jpg">
      <img id="img4" src="cenario4.jpg">
    </a-assets>

    <!-- Fundo 360° -->
    <a-sky id="ambiente" src="#img1" rotation="0 -90 0"></a-sky>

    <!-- Esfera/Portal Clicável -->
    <a-sphere
      id="portal"
      class="clicavel"
      position="0 1.6 -3"
      radius="0.25"
      color="#00FFFF"
      animation__pulse="property: scale; to: 1.2 1.2 1.2; dir: alternate; dur: 900; loop: true">
    </a-sphere>

    <!-- Câmera com Cursor Branco -->
    <a-camera position="0 1.6 0">
      <a-cursor
        id="cursor"
        fuse="true"
        fuse-timeout="1500"
        raycaster="objects: .clicavel"
        color="#FFFFFF"
        animation__fusing="property: scale; startEvents: fusing; easing: linear; dur: 1500; from: 1.5 1.5 1.5; to: 0.1 0.1 0.1"
        animation__mouseleave="property: scale; startEvents: mouseleave; easing: easeInCubic; dur: 150; to: 1 1 1"
        animation__click="property: scale; startEvents: click; easing: easeInCubic; dur: 150; from: 0.1 0.1 0.1; to: 1 1 1">
      </a-cursor>
    </a-camera>
  </a-scene>

  <script>
    let atual = 1;
    const portal = document.querySelector("#portal");
    const ambiente = document.querySelector("#ambiente");

    // Troca de cenário
    portal.addEventListener("click", () => {
      atual = (atual % 4) + 1;
      ambiente.setAttribute("src", "#img" + atual);
    });
  </script>
</body>
</html>
