<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Museu Virtual VR</title>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
</head>
<body>
  <a-scene>
    <a-assets>
      <img id="img1" src="cenario1.jpg">
      <img id="img2" src="cenario2.jpg">
      <img id="img3" src="cenario3.jpg">
      <img id="img4" src="cenario4.jpg">
    </a-assets>

    <a-sky id="ambiente" src="#img1" rotation="0 -90 0"></a-sky>

    <a-sphere
      id="portal"
      class="clicavel"
      position="0 1.6 -3"
      radius="0.18"
      color="#00FFFF"
      animation__pulse="property: scale; to: 1.2 1.2 1.2; dir: alternate; dur: 900; loop: true">
    </a-sphere>

    <a-camera position="0 1.6 0">
      <a-cursor
        fuse="true"
        fuse-timeout="1500"
        raycaster="objects: .clicavel"
        color="#FFFFFF">
      </a-cursor>
    </a-camera>
  </a-scene>

  <script>
    let atual = 1;

    document.querySelector("#portal").addEventListener("click", () => {
      atual = atual % 4 + 1;
      document.querySelector("#ambiente").setAttribute("src", "#img" + atual);
    });
  </script>
</body>
</html>
